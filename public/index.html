<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineBox — Stream, Discover & Download</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/vendor/hls.min.js" defer></script>
</head>
<body>
  <!-- Top Navigation Bar -->
  <header class="navbar" id="navbar">
    <div class="nav-left">
      <button class="brand" id="brandBtn" title="CineBox Home">
        <span class="brand-mark">
          <svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm5.5 4.2v7.6L16.5 12 9.5 8.2z"/></svg>
        </span>
        <span class="brand-text" id="brandName">CINE<span>BOX</span></span>
      </button>

      <nav class="nav-links" id="navLinks">
        <button class="nav-link active" data-view="home">Home</button>
        <button class="nav-link" data-view="movies">Movies</button>
        <button class="nav-link" data-view="series">Series</button>
        <button class="nav-link" data-view="downloads">Download Hub</button>
        <button class="nav-link" data-view="discover">TMDB Discover</button>
        <button class="nav-link" data-view="local">Local Drive</button>
        <button class="nav-link" data-view="watchlist">My List <span class="badge-pill" id="watchlistCount">0</span></button>
      </nav>
    </div>

    <div class="nav-right">
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
        </svg>
        <input type="text" id="globalSearch" placeholder="Search movies, actors, genres..." autocomplete="off" />
        <button class="search-clear hidden" id="searchClear" title="Clear search">&times;</button>
      </div>

      <button class="icon-btn" data-view="admin" id="adminNavBtn" title="Admin Studio & Upload">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        <span class="hide-sm">Studio</span>
      </button>

      <button class="icon-btn" data-view="settings" id="settingsNavBtn" title="Settings & LAN Sharing">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
          <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Content Mount -->
  <main id="appMain" class="app-main"></main>

  <!-- Movie / Series Detail Modal -->
  <div id="detailModal" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div class="modal-sheet" id="detailModalBody"></div>
  </div>

  <!-- Fullscreen Custom Cinema Video Player Overlay -->
  <div id="playerOverlay" class="player-overlay hidden">
    <div class="player-stage" id="playerStage">
      <video id="videoElement" playsinline crossorigin="anonymous"></video>

      <!-- Loading Spinner -->
      <div class="player-spinner hidden" id="playerSpinner">
        <div class="spinner-ring"></div>
        <span id="playerStatusText">Buffering stream...</span>
      </div>

      <!-- Top Bar -->
      <div class="player-top" id="playerTop">
        <button class="player-icon-btn" id="playerCloseBtn" title="Close Player (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="22" height="22"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </button>
        <div class="player-meta">
          <div class="player-title" id="playerTitle">Now Playing</div>
          <div class="player-subtitle" id="playerSubMeta">1080p • Server 1</div>
        </div>
        <div class="player-top-actions">
          <a id="playerDownloadLink" class="player-pill-btn hidden" target="_blank" download>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </a>
        </div>
      </div>

      <!-- Center Quick Play Pulse -->
      <button class="player-center-play hidden" id="playerCenterPlay" aria-label="Play/Pause">
        <svg viewBox="0 0 24 24" fill="currentColor" width="44" height="44"><polygon points="6 4 20 12 6 20 6 4"/></svg>
      </button>

      <!-- Bottom Controls -->
      <div class="player-controls" id="playerControls">
        <!-- Seek / Progress Bar -->
        <div class="seek-bar-wrap" id="seekBarWrap">
          <div class="seek-tooltip hidden" id="seekTooltip">00:00</div>
          <div class="seek-track">
            <div class="seek-buffered" id="seekBuffered"></div>
            <div class="seek-progress" id="seekProgress"></div>
          </div>
        </div>

        <div class="controls-row">
          <div class="controls-left">
            <button class="player-icon-btn" id="playPauseBtn" title="Play / Pause (Space)">
              <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><polygon points="6 4 20 12 6 20 6 4"/></svg>
              <svg id="pauseIcon" class="hidden" viewBox="0 0 24 24" fill="currentColor" width="22" height="22"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
            </button>
            <button class="player-icon-btn" id="skipBackBtn" title="Back 10s (←)">-10s</button>
            <button class="player-icon-btn" id="skipFwdBtn" title="Forward 10s (→)">+10s</button>

            <div class="volume-group">
              <button class="player-icon-btn" id="muteBtn" title="Mute (M)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="19" height="19"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
              </button>
              <input type="range" id="volumeSlider" min="0" max="1" step="0.02" value="1" class="volume-slider" />
            </div>

            <span class="time-display" id="timeDisplay">00:00 / 00:00</span>
          </div>

          <div class="controls-right">
            <!-- Next Episode (series only) -->
            <button class="player-pill-btn hidden" id="nextEpisodeBtn" title="Next Episode">Next Ep &raquo;</button>

            <!-- Server / Mirror Selector -->
            <div class="player-menu-wrap">
              <button class="player-pill-btn" id="serverMenuBtn" title="Switch Server / Mirror">Servers</button>
              <div class="player-popover hidden" id="serverMenu"></div>
            </div>

            <!-- HLS Bitrate Selector -->
            <div class="player-menu-wrap hidden" id="hlsQualityWrap">
              <button class="player-pill-btn" id="hlsQualityBtn" title="Adaptive Quality">Auto</button>
              <div class="player-popover hidden" id="hlsQualityMenu"></div>
            </div>

            <!-- Subtitles Selector -->
            <div class="player-menu-wrap">
              <button class="player-pill-btn" id="subtitleMenuBtn" title="Subtitles">CC</button>
              <div class="player-popover hidden" id="subtitleMenu"></div>
              <input type="file" id="localSubtitleInput" accept=".srt,.vtt" class="hidden" />
            </div>

            <!-- Speed -->
            <select id="speedSelect" class="player-select" title="Playback Speed">
              <option value="0.5">0.5x</option>
              <option value="0.75">0.75x</option>
              <option value="1" selected>1x</option>
              <option value="1.25">1.25x</option>
              <option value="1.5">1.5x</option>
              <option value="2">2x</option>
            </select>

            <button class="player-icon-btn" id="pipBtn" title="Picture-in-Picture">PiP</button>
            <button class="player-icon-btn" id="fullscreenBtn" title="Fullscreen (F)">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="19" height="19"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
